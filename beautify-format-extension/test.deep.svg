<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgb(255,255,0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(255,0,0);stop-opacity:1" />
    </linearGradient>
  </defs>
  <style>
    .class1 { fill: url(#grad1); }
    .class2 { stroke: black; stroke-width: 2; }
  </style>
  <g transform="translate(10, 10)">
    <rect x="10" y="10" width="30" height="30" class="class1" />
    <circle cx="50" cy="50" r="20" class="class2" />
    <path d="M 10 10 L 90 90 M 90 10 L 10 90" stroke="blue" stroke-width="5" fill="none" />
  </g>
  <text x="10" y="90" font-family="Verdana" font-size="10" fill="black">
    Hello World!
    <tspan x="10" dy="1.2em">This is a tspan</tspan>
  </text>
  <!-- Comment -->
  <foreignObject x="20" y="20" width="160" height="160">
    <div xmlns="http://www.w3.org/1999/xhtml">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    </div>
  </foreignObject>
</svg>