# A complex GraphQL query with various features to test Deep Formatting

query GetUser($id: ID!, $withProfile: Boolean = true) {
  user(id: $id) {
    id
    username
    email
    ... on Admin {
      permissions
      auditLog(limit: 10) {
        action
        timestamp
        details
      }
    }
    profile @include(if: $withProfile) {
      firstName
      lastName
      avatarUrl
      settings {
        theme
        notifications {
          email
          push
        }
      }
    }
    friends(first: 5) {
      edges {
        node {
          ...UserFields
        }
        cursor
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    user {
      id
      username
      email
    }
    errors {
      field
      message
    }
  }
}

subscription OnUserUpdated {
  userUpdated {
    id
    username
    ... on Admin {
      permissions
    }
  }
}

fragment UserFields on User {
  id
  username
  email
}

interface Node {
  id: ID!
}

type User implements Node {
  id: ID!
  username: String!
  email: String
  profile: Profile
  friends(first: Int, after: String): UserConnection
}

type Profile {
  firstName: String
  lastName: String
  avatarUrl: String
  settings: Settings
}

type Settings {
  theme: Theme
  notifications: NotificationSettings
}

type NotificationSettings {
  email: Boolean!
  push: Boolean!
}

type UserConnection {
  edges: [UserEdge]
  pageInfo: PageInfo!
}

type UserEdge {
  node: User
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

enum Theme {
  LIGHT
  DARK
  SYSTEM
}

input UpdateUserInput {
  id: ID!
  username: String
  email: String
  profile: UpdateProfileInput
}

input UpdateProfileInput {
  firstName: String
  lastName: String
  theme: Theme
}

union SearchResult = User | Post | Comment

directive @deprecated(
  reason: String = "No longer supported"
) on FIELD_DEFINITION | ENUM_VALUE

scalar Date
