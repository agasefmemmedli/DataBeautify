# TOML Complex Test File for Deep Formatting verification

title = "TOML Deep Formatting Test"

[package]
name = "complex-toml"
version = "0.1.0"
authors = ["Beautifier <bot@example.com>"]
edition = "2021"

# Nested tables and arrays
[[bin]]
name = "demo"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.28", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.3"

# Inline tables with mixed spacing
[features]
default = ["std", "macro"]
std = []
macro = ["dep:macro"]

# Array of tables
[[example]]
name = "simple"
required-features = ["std"]

[[example]]
name = "complex"
required-features = ["macro"]

# Multiline strings
description = """
This is a long description
that spans multiple lines
and should be preserved.
"""

literal_multiline = '''
Here are some
literal strings
'''

# Mixed types
[mixed_types]
integers = [ 1, 2, 3 ]
floats = [ 1.1, 2.2, 3.3 ]
booleans = [ true, false, true ]
dates = [ 1979-05-27T07:32:00Z, 1979-05-27T00:32:00-07:00 ]

# Deeply nested inline
[nested.deeply]
struct = { x = 1, y = { z = 2, w = [3, 4] } }
