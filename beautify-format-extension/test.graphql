query GetUser($id: ID!) {
  user(id: $id) {
    id
    username
    email
    profile {
      firstName
      lastName
      avatarUrl
    }
  }
}

mutation UpdateUser($input: UpdateUserInput!) {
  updateUser(input: $input) {
    user {
      id
      username
    }
  }
}

subscription OnUserUpdated {
  userUpdated {
    id
    username
  }
}

fragment UserFields on User {
  id
  username
}

type User {
  id: ID!
  username: String!
  email: String
}

enum Role {
  ADMIN
  USER
  GUEST
}

