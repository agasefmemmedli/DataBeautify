name: Auto-Merge to Main (Agasef)

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'

jobs:
  auto-merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # --- CHECK COMMIT AUTHOR ---
      - name: Check if author is Agasef
        id: check_author
        run: |
          AUTHOR="${{ github.event.head_commit.author.name }}"
          EMAIL="${{ github.event.head_commit.author.email }}"
          
          echo "Автор коммита: $AUTHOR"
          echo "Email: $EMAIL"
          
          # Проверяем: Agasef Memmedli ИЛИ google-labs-jules[bot]
          if [[ "$AUTHOR" == "Agasef Memmedli" ]] || \
             [[ "$AUTHOR" == "agasef"* ]] || \
             [[ "$EMAIL" == *"agasef"* ]] || \
             [[ "$AUTHOR" == "google-labs-jules[bot]" ]] || \
             [[ "$EMAIL" == *"google-labs-jules"* ]]; then
            echo "should_merge=true" >> $GITHUB_OUTPUT
            echo "✅ Коммит от Agasef или разрешенного бота - продолжаем"
          else
            echo "should_merge=false" >> $GITHUB_OUTPUT
            echo "⚠️ Коммит НЕ от Agasef - пропускаем"
            exit 0
          fi
      
      # --- AUTOMATIC BRANCH CLEANUP ---
      - name: Cleanup Old Branches
        if: steps.check_author.outputs.should_merge == 'true'
        run: |
          echo "Starting branch cleanup..."
          git fetch --prune
          
          # Удаляем старые ветки, оставляя только 10 самых свежих
          branches_to_delete=$(git branch -r --sort=-committerdate | \
            grep -vE "origin/main|origin/master|RELEASE" | \
            sed 's/origin\///' | \
            tail -n +11)
          
          if [ -z "$branches_to_delete" ]; then
            echo "No branches to delete."
          else
            for branch in $branches_to_delete; do
              echo "Deleting old branch: $branch"
              git push origin --delete "$branch" || echo "Failed to delete $branch"
            done
          fi
      
      # --- MERGE TO MAIN ---
      - name: Merge to main
        if: steps.check_author.outputs.should_merge == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "🔄 Merging ${{ github.ref_name }} into main..."
          
          # Переключаемся на main и обновляем
          git checkout main
          git pull origin main
          
          # Мержим текущую ветку
          if git merge --no-ff ${{ github.ref_name }} -m "🤖 Auto-merge: ${{ github.ref_name }} by ${{ github.event.head_commit.author.name }}"; then
            echo "✅ Merge successful!"
            git push origin main
            echo "✅ Changes pushed to main!"
          else
            echo "❌ ERROR: Merge conflicts detected"
            echo "Please resolve conflicts manually"
            exit 1
          fi
      
      # --- DELETE SOURCE BRANCH ---
      - name: Delete merged branch
        if: steps.check_author.outputs.should_merge == 'true' && success()
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Не удаляем защищенные ветки
          if [[ "$BRANCH_NAME" == *"RELEASE"* ]] || [[ "$BRANCH_NAME" == "develop" ]] || [[ "$BRANCH_NAME" == "dev" ]]; then
            echo "🔒 Protected branch - skipping deletion"
          else
            echo "🗑️ Deleting branch: $BRANCH_NAME"
            git push origin --delete "$BRANCH_NAME" || echo "Branch already deleted or protected"
          fi
      
      # --- SUMMARY ---
      - name: Summary
        if: always()
        run: |
          echo "### 📊 Auto-Merge Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.event.head_commit.author.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Email:** ${{ github.event.head_commit.author.email }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Should Merge:** ${{ steps.check_author.outputs.should_merge }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY